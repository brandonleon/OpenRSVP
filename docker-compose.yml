services:
  app:
    build:
      context: .
    container_name: openrsvp_app
    expose:
      - "8000"
    volumes:
      - "${OPENRSVP_DATA_DIR:-./data}:/app/data"
    restart: unless-stopped
    networks:
      - openrsvp

  nginx:
    image: nginx:1.27-alpine
    container_name: openrsvp_nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/letsencrypt
      - ./deploy/certbot-www:/var/www/certbot
    restart: unless-stopped
    networks:
      - openrsvp

  certbot:
    build: ./deploy/certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certs:/etc/letsencrypt
      - ./deploy/certbot-www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - openrsvp

networks:
  openrsvp:
    driver: bridge
