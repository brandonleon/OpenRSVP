services:
  app:
    build:
      context: .
    container_name: openrsvp_app
    expose:
      - "8000"
    volumes:
      - "${OPENRSVP_DATA_DIR:-./data}:/app/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - openrsvp

  nginx:
    image: nginx:1.27-alpine
    container_name: openrsvp_nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/letsencrypt
      - ./deploy/certbot-www:/var/www/certbot
    restart: unless-stopped
    networks:
      - openrsvp

  certbot:
    build: ./deploy/certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certs:/etc/letsencrypt
      - ./deploy/certbot-www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - openrsvp

networks:
  openrsvp:
    driver: bridge
